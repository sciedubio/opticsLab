<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="빛과 렌즈 마스터">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3253/3253013.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3253/3253013.png">
    <title>빛과 렌즈 마스터: 실험, 게임, 공방</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .neon-text-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.4); }
        .neon-text-amber { text-shadow: 0 0 10px rgba(245, 158, 11, 0.8), 0 0 20px rgba(245, 158, 11, 0.4); }
        .neon-text-emerald { text-shadow: 0 0 10px rgba(16, 185, 129, 0.8), 0 0 20px rgba(16, 185, 129, 0.4); }

        .btn-neon { transition: all 0.2s ease; position: relative; overflow: hidden; }
        .btn-neon:active { transform: scale(0.95); }

        .toggle-checkbox:checked { right: 0; border-color: #06b6d4; }
        .toggle-checkbox:checked + .toggle-label { background-color: #06b6d4; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #06b6d4; cursor: pointer; margin-top: -10px; box-shadow: 0 0 15px rgba(6, 182, 212, 0.8); border: 2px solid white; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px; }
        
        .hero-title { font-size: clamp(2rem, 5vw, 4rem); font-weight: 900; line-height: 1.2; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .draggable-cursor { cursor: grab; }
        .draggable-cursor:active { cursor: grabbing; }

        /* Animations */
        @keyframes swipe-out-left { to { transform: translateX(-150%) rotate(-15deg); opacity: 0; } }
        @keyframes swipe-out-right { to { transform: translateX(150%) rotate(15deg); opacity: 0; } }
        @keyframes drop-in { from { transform: scale(0.8) translateY(-50px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        
        .card-enter { animation: drop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .swipe-left { animation: swipe-out-left 0.4s forwards; }
        .swipe-right { animation: swipe-out-right 0.4s forwards; }
        
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 10%, 30%, 50%, 70%, 90% {transform: translateX(-5px);} 20%, 40%, 60%, 80% {transform: translateX(5px);} }
        
        .lens-effect-transition { transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- Web Audio API (효과음) 설정 ---
        const audioCtxRef = { current: null };
        const initAudio = () => {
            if (!audioCtxRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtxRef.current = new AudioContext();
            }
            if (audioCtxRef.current.state === 'suspended') {
                audioCtxRef.current.resume();
            }
        };
        const playTone = (freq, type, duration, vol=0.1) => {
            if(!audioCtxRef.current) return;
            const ctx = audioCtxRef.current;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(vol, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        };
        const playSound = (type) => {
            try {
                if (type === 'success') { playTone(523.25, 'sine', 0.1); setTimeout(()=>playTone(659.25, 'sine', 0.2), 100); }
                else if (type === 'error') { playTone(300, 'square', 0.15); setTimeout(()=>playTone(250, 'square', 0.2), 150); }
                else if (type === 'complete') { playTone(523.25, 'sine', 0.1); setTimeout(()=>playTone(659.25, 'sine', 0.1), 100); setTimeout(()=>playTone(783.99, 'sine', 0.2), 200); setTimeout(()=>playTone(1046.50, 'sine', 0.4), 300); }
            } catch(e) {}
        };

        // --- 데이터 연동 설정 ---
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzYbNLuG-unew1v5QBY7jZCcw2bvOI01aL13Gf91wCdmKlhAqXQM4JPXsq27GX_yF2/exec"; 

        // --- 스와이프 게임 데이터 ---
        const GAME_ITEMS = [
            { id: 1, name: "자동차 측면 거울", emoji: "🚘", type: "convex_mirror", desc: "넓은 범위를 봐야 해요", explanation: "자동차 측면 거울은 넓은 범위를 비춰야 하므로 빛을 퍼뜨려 항상 실물보다 작고 똑바로 선 상을 만드는 '볼록 거울'을 사용합니다." },
            { id: 2, name: "편의점 보안 거울", emoji: "🏪", type: "convex_mirror", desc: "사각지대 없이 넓게!", explanation: "가게 전체를 한눈에 보기 위해 시야가 넓은 '볼록 거울'을 사용합니다." },
            { id: 3, name: "굽은 도로 거울", emoji: "🛣️", type: "convex_mirror", desc: "반대편 차가 오는지 확인", explanation: "사각지대를 없애기 위해 넓은 범위를 보여주는 '볼록 거울'을 사용합니다." },
            { id: 4, name: "화장 거울", emoji: "💄", type: "concave_mirror", desc: "모공까지 크게 보고 싶어요", explanation: "가까이 있는 물체를 확대해서 똑바로 선 상을 보여주는 '오목 거울'의 특징을 이용합니다." },
            { id: 5, name: "치과용 거울", emoji: "🦷", type: "concave_mirror", desc: "작은 치아를 크게!", explanation: "치아의 세밀한 부분을 확대해서 보기 위해 '오목 거울'을 사용합니다." },
            { id: 6, name: "근시 교정 안경", emoji: "👓", type: "concave_lens", desc: "멀리 있는 글씨가 안 보여요", explanation: "망막 앞쪽에 맺히는 상을 빛을 퍼뜨려 뒤로 밀어주는 '오목 렌즈'로 근시를 교정합니다." },
            { id: 7, name: "원시 교정 안경", emoji: "👵", type: "convex_lens", desc: "가까운 책 글씨가 흐려요", explanation: "망막 뒤쪽에 맺히는 상을 빛을 모아 앞으로 당겨주는 '볼록 렌즈'로 원시를 교정합니다." },
            { id: 8, name: "돋보기", emoji: "🔍", type: "convex_lens", desc: "작은 글씨를 확대해서 봅니다", explanation: "가까운 물체를 확대해서 보여주는 '볼록 렌즈'의 특징을 이용합니다." },
            { id: 9, name: "현미경 / 망원경", emoji: "🔬", type: "convex_lens", desc: "아주 작은 것을 크게!", explanation: "빛을 모아 물체를 크게 확대하는 데 주로 '볼록 렌즈'가 사용됩니다." },
            { id: 10, name: "태양열 조리기", emoji: "☀️", type: "concave_mirror", desc: "햇빛을 한 곳에 모아 불을 피워요", explanation: "평행하게 들어온 빛을 한 점(초점)으로 모으는 '오목 거울'의 성질을 이용합니다." }
        ];

        const MINI_QUIZZES = [
            { q: "빛을 한 곳으로 모으는 성질이 있는 거울은?", options: ["오목 거울", "볼록 거울"], answer: "오목 거울" },
            { q: "가까운 것은 잘 보이나 먼 곳이 잘 안 보이는 '근시'를 교정하는 렌즈는?", options: ["볼록 렌즈", "오목 렌즈"], answer: "오목 렌즈" },
            { q: "자동차 측면 거울처럼 항상 실물보다 '작고 똑바로 선 상'을 만들어 시야를 넓혀주는 거울은?", options: ["오목 거울", "볼록 거울"], answer: "볼록 거울" }
        ];

        // --- 안경점 & 공방 시뮬레이션 데이터 ---
        const WORKSHOP_MISSIONS = [
            {
                id: 1, type: 'concave_lens',
                emoji: '🧑‍🎓', name: '근시 학생',
                problem: "멀리 있는 칠판 글씨가 흐리게 보여서 필기를 못 하겠어요. 안경을 맞춰주세요!",
                hint: "빛을 '퍼뜨려서' 앞쪽에 맺힌 상을 뒤로 밀어주는 렌즈가 필요해요.",
                successTitle: "시야가 선명해졌어요!",
                successDesc: "오목 렌즈는 빛을 퍼뜨려 근시안의 망막에 상이 정확히 맺히게 도와줍니다.",
                visualContent: "E C P T", effectType: "blur"
            },
            {
                id: 2, type: 'convex_lens',
                emoji: '👴', name: '원시 할아버지',
                problem: "가까운 신문 글씨가 흐릿해서 읽기 힘들어. 돋보기 안경이 필요해.",
                hint: "빛을 '모아서' 뒤쪽에 맺힌 상을 앞으로 당겨주는 렌즈가 필요해요.",
                successTitle: "글씨가 또렷하게 잘 보이네!",
                successDesc: "볼록 렌즈는 빛을 모아주어 원시안의 망막에 상이 정확히 맺히게 도와줍니다.",
                visualContent: "📰 뉴스 속보", effectType: "blur"
            },
            {
                id: 3, type: 'concave_mirror',
                emoji: '💄', name: '뷰티 유튜버',
                problem: "눈 화장을 세밀하게 해야 하는데, 얼굴을 아주 크게 확대해서 볼 수 있는 거울을 만들어주세요!",
                hint: "가까이 있는 물체를 '확대해서' 보여주는 거울을 찾아보세요.",
                successTitle: "얼굴이 아주 크게 잘 보여요!",
                successDesc: "오목 거울은 초점 안쪽에 물체가 있을 때 크고 똑바로 선 상을 만들어줍니다.",
                visualContent: "👁️", effectType: "magnify"
            },
            {
                id: 4, type: 'convex_mirror',
                emoji: '👮', name: '편의점 사장님',
                problem: "매장이 너무 넓어서 도둑이 들까 걱정이에요. 사각지대 없이 가게 전체를 한눈에 볼 수 있는 거울 없나요?",
                hint: "빛을 퍼뜨려서 '넓은 범위'를 보여주는 거울을 찾아보세요.",
                successTitle: "사각지대 없이 다 보여요!",
                successDesc: "볼록 거울은 항상 물체보다 작은 똑바로 선 상을 만들어, 같은 크기의 거울로 훨씬 더 넓은 범위를 비출 수 있습니다.",
                visualContent: "🏪 🚶 🧍", effectType: "wide"
            }
        ];

        const { useState, useEffect, useRef, useMemo } = React;

        const Icons = {
            MirrorConcave: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-6 h-6"><path d="M14 4c-3 4-3 12 0 16" strokeLinecap="round"/><line x1="16" y1="4" x2="18" y2="4"/><line x1="14" y1="8" x2="16" y2="8"/><line x1="13" y1="12" x2="15" y2="12"/><line x1="14" y1="16" x2="16" y2="16"/><line x1="16" y1="20" x2="18" y2="20"/></svg>,
            MirrorConvex: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-6 h-6"><path d="M10 4c3 4 3 12 0 16" strokeLinecap="round"/><line x1="6" y1="4" x2="8" y2="4"/><line x1="8" y1="8" x2="10" y2="8"/><line x1="9" y1="12" x2="11" y2="12"/><line x1="8" y1="16" x2="10" y2="16"/><line x1="6" y1="20" x2="8" y2="20"/></svg>,
            LensConvex: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-6 h-6"><path d="M12 2C8 6 8 18 12 22C16 18 16 6 12 2Z"/></svg>,
            LensConcave: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-6 h-6"><path d="M8 2h8M8 22h8M8 2c2 5 2 15 0 20M16 2c-2 5-2 15 0 20"/></svg>,
            Info: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>,
            Close: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-6 h-6"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Check: () => <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="3" className="w-8 h-8"><polyline points="20 6 9 17 4 12"/></svg>,
            XMark: () => <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="3" className="w-8 h-8"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Gamepad: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><rect x="2" y="6" width="20" height="12" rx="2" ry="2"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/></svg>,
            Flask: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><line x1="5.52" y1="16" x2="18.48" y2="16"/></svg>,
            Storefront: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        };

        function Modal({ isOpen, title, children, onClose }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
                    <div className="glass-panel rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto transform transition-all shadow-2xl border border-slate-600 animate-[drop-in_0.3s_ease-out]">
                        <div className="sticky top-0 bg-slate-800/90 backdrop-blur-md p-4 border-b border-slate-700 flex justify-between items-center z-10">
                            <h3 className="text-xl font-bold text-white">{title}</h3>
                            {onClose && <button onClick={onClose} className="p-1 rounded-full hover:bg-slate-700 transition-colors text-slate-300"><Icons.Close /></button>}
                        </div>
                        <div className="p-6 text-slate-200">{children}</div>
                    </div>
                </div>
            );
        }

        function AdminGuideModal({ isOpen, onClose }) {
            const codeString = `function doPost(e) {
  try {
    const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    const data = JSON.parse(e.postData.contents);
    sheet.appendRow([
      new Date(),
      data.studentId || "",
      data.studentName || "",
      data.gameScore !== undefined ? data.gameScore : "",
      data.workshopScore !== undefined ? data.workshopScore : "",
      data.records || "", 
      data.insight || ""
    ]);
    return ContentService.createTextOutput(JSON.stringify({result:"success"}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({result:"error", message: err.message}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;
            return (
                <Modal isOpen={isOpen} title="DB 연동 및 배포 가이드" onClose={onClose}>
                    <div className="space-y-6 text-sm">
                        <section className="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                            <h4 className="font-bold text-cyan-400 text-lg mb-2 flex items-center gap-2">① 구글 시트 1행 헤더</h4>
                            <code className="block bg-slate-900 p-3 rounded-lg text-emerald-300 font-mono text-[10px] sm:text-[11px] overflow-x-auto whitespace-nowrap">
                                timestamp | studentId | studentName | gameScore | workshopScore | records | insight
                            </code>
                        </section>
                        <section className="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                            <div className="flex justify-between items-center mb-2">
                                <h4 className="font-bold text-cyan-400 text-lg flex items-center gap-2">② Apps Script 작성</h4>
                                <button onClick={(e) => { 
                                    const textArea = document.createElement("textarea");
                                    textArea.value = codeString;
                                    textArea.style.position = "fixed";
                                    textArea.style.left = "-9999px";
                                    document.body.appendChild(textArea);
                                    textArea.select();
                                    document.execCommand("copy");
                                    document.body.removeChild(textArea);
                                    
                                    const btn = e.target;
                                    btn.innerText = "복사 완료!"; 
                                    setTimeout(() => btn.innerText = "코드 복사", 2000); 
                                }} className="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs text-white transition">코드 복사</button>
                            </div>
                            <pre className="bg-slate-900 p-3 rounded-lg text-slate-300 font-mono text-[10px] sm:text-[11px] overflow-x-auto"><code>{codeString}</code></pre>
                        </section>
                        <section className="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                            <h4 className="font-bold text-cyan-400 text-lg mb-2">③ 배포 방법</h4>
                            <ol className="list-decimal pl-5 space-y-1 text-slate-300">
                                <li>[배포] &gt; [새 배포] &gt; [웹 앱]</li>
                                <li>액세스 권한: "모든 사용자"</li>

                            {activeTab === 'game' && <GameTab score={gameScore} setScore={setGameScore} />}
                            {activeTab === 'workshop' && <WorkshopTab score={workshopScore} setScore={setWorkshopScore} />}
                        </main>

                        <nav className="fixed bottom-0 left-0 w-full bg-slate-900 border-t border-slate-700 z-50 md:sticky md:bottom-auto md:border-t-0 md:bg-transparent md:p-4 md:flex md:justify-center">
                            <div className="flex max-w-2xl mx-auto md:bg-slate-800 md:rounded-full md:border md:border-slate-700 md:overflow-hidden md:p-1 w-full">

                            <button onClick={() => setAlertInfo({ show: false, msg: '' })} className="w-full mt-4 py-3 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-bold">확인</button>

            if (view === 'report') {
                return <ReportView goBack={() => setView('app')} gameScore={gameScore} workshopScore={workshopScore} labRecords={labRecords} onComplete={(name) => { setFinalStudentName(name); setView('done'); playSound('complete'); }} showAlert={showAlert} />;
            }

            if (view === 'done') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 md:p-6 text-center">
                        {/* 빛과 렌즈 마스터 인증서 디자인 */}
                        <div className="glass-panel p-8 md:p-12 rounded-xl max-w-xl w-full border-4 border-double border-amber-500/50 shadow-[0_0_30px_rgba(245,158,11,0.2)] bg-slate-900/90 relative overflow-hidden animate-[drop-in_0.5s_ease-out]">
                            {/* 장식용 모서리 */}
                            <div className="absolute top-0 left-0 w-16 h-16 bg-amber-500/20 rounded-br-full"></div>

                            <h2 className="text-3xl md:text-4xl font-black text-amber-400 mb-2 tracking-widest">인증서</h2>
                            <h3 className="text-lg text-slate-300 mb-8 border-b border-slate-700/50 pb-4">빛과 렌즈 마스터</h3>
                            
                            <div className="text-xl text-white mb-6">
                                이름: <strong className="text-2xl text-cyan-300 ml-2">{finalStudentName}</strong>
                            </div>
                            
                            <p className="text-slate-300 leading-relaxed mb-8 px-4 font-medium text-sm md:text-base break-keep">
                                위 학생은 가상 실험실에서 빛의 경로를 능동적으로 탐구하고, 실생활 광학 기기를 성공적으로 분류하였으며, 해결 공방의 미션을 훌륭히 완수하였으므로 이 증서를 수여합니다.
                            </p>
                            
                            <div className="flex justify-center flex-wrap gap-3 mb-8 text-sm">
                                <div className="bg-slate-800 px-4 py-2 rounded-lg border border-amber-500/30 text-slate-300 shadow-md">게임 <span className="text-amber-400 font-bold ml-1">{gameScore}점</span></div>
                                <div className="bg-slate-800 px-4 py-2 rounded-lg border border-emerald-500/30 text-slate-300 shadow-md">공방 <span className="text-emerald-400 font-bold ml-1">{workshopScore}점</span></div>
                                <div className="bg-slate-800 px-4 py-2 rounded-lg border border-cyan-500/30 text-slate-300 shadow-md">실험 <span className="text-cyan-400 font-bold ml-1">{labRecords.length}회 기록</span></div>
                            </div>
                            
                            <div className="text-6xl mb-6 drop-shadow-lg">🏅</div>
                            
                            <p className="text-xs text-slate-500 mb-6 bg-slate-800/50 inline-block px-3 py-1 rounded-full">💡 화면을 캡처하여 자랑스럽게 보관해보세요!</p>
                            
                            <button onClick={() => { setView('intro'); setGameScore(0); setWorkshopScore(0); setLabRecords([]); setActiveTab('lab'); }} className="w-full max-w-xs py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold active:scale-95 transition-all mx-auto block">

                );

        // --- 탭 1: 가상 실험실 (Lab Tab) ---
        function LabTab({ records, setRecords, showAlert }) {
            const [device, setDevice] = useState('concave_mirror'); 
            const [u, setU] = useState(150); 
            const [showRays, setShowRays] = useState(false);
            const [isDragging, setIsDragging] = useState(false);
            const [objType, setObjType] = useState('arrow'); // 물체 종류 상태 추가
            const [showTutorial, setShowTutorial] = useState(true); // 튜토리얼 상태 추가
            const svgRef = useRef(null);

            const deviceOptions = [
                { id: 'concave_mirror', name: '오목 거울', icon: <Icons.MirrorConcave/>, color: 'text-cyan-400' },
                { id: 'convex_mirror', name: '볼록 거울', icon: <Icons.MirrorConvex/>, color: 'text-blue-400' },
                { id: 'convex_lens', name: '볼록 렌즈', icon: <Icons.LensConvex/>, color: 'text-purple-400' },
                { id: 'concave_lens', name: '오목 렌즈', icon: <Icons.LensConcave/>, color: 'text-fuchsia-400' }
            ];
            
            const objOptions = [
                { id: 'arrow', label: '화살표' }, { id: 'apple', label: '🍎' }, { id: 'dog', label: '🐶' }, { id: 'rocket', label: '🚀' }
            ];

            const physicsInfo = useMemo(() => {
                const f_val = 100;
                let f, isMirror;
                if(device === 'concave_mirror') { f = f_val; isMirror = true; }
                if(device === 'convex_mirror') { f = -f_val; isMirror = true; }
                if(device === 'convex_lens') { f = f_val; isMirror = false; }
                if(device === 'concave_lens') { f = -f_val; isMirror = false; }

                let calcU = u;
                if (Math.abs(calcU - f_val) < 1) calcU = f_val + 1; 

                const b = (calcU * f) / (calcU - f);
                const isReal = b > 0;
                const magSize = Math.abs(b / calcU);
                const isInverted = isReal; 

                let descSize = magSize > 1.05 ? "확대된" : magSize < 0.95 ? "축소된" : "크기가 같은";
                let descOrient = isInverted ? "거꾸로 선 상" : "똑바로 선 상";

                if (Math.abs(u - f_val) < 2) { 
                    descSize = "초점 위치"; 
                    descOrient = "(상 안 생김)"; 
                }
                return { b, magSize, isReal, isInverted, descSize, descOrient, isMirror, f_val };
            }, [device, u]);

            const addRecord = () => {
                const { descSize, descOrient } = physicsInfo;
                let distType = u <= 80 ? "가까울 때" : u <= 180 ? "멀 때" : "아주 멀 때";
                const devName = deviceOptions.find(d => d.id === device).name;
                const resultStr = u === 100 ? "상 없음" : `${descSize} ${descOrient}`;
                
                if(records.some(r => r.device === devName && Math.abs(r.u - u) < 5)) {
                    showAlert("이미 기록된 비슷한 조건이 있습니다."); return;
                }
                setRecords(prev => [{ device: devName, u, distType, result: resultStr }, ...prev]);
                playSound('success');
                showAlert("표에 성공적으로 기록되었습니다!");
            };

            const handlePointerDown = (e) => { if(e.target.dataset.draggable) { setIsDragging(true); e.target.setPointerCapture(e.pointerId); } };
            const handlePointerMove = (e) => {
                if(!isDragging || !svgRef.current) return;
                const rect = svgRef.current.getBoundingClientRect();
                let newU = 400 - ((e.clientX - rect.left) * (800 / rect.width));
                setU(Math.round(Math.max(20, Math.min(300, newU))));
            };
            const handlePointerUp = (e) => { if(isDragging) { setIsDragging(false); e.target.releasePointerCapture(e.pointerId); } };

            const renderRays = () => {
                if (!showRays || Math.abs(u - 100) < 2) return null;
                const { b, isReal, isInverted, magSize, isMirror } = physicsInfo;
                const m = magSize * (isInverted ? -1 : 1);
                const Iy = 200 - 60 * m;
                const Ix = isMirror ? 400 - b : 400 + b;

                const getRayLine = (x1, y1, targetX, targetY, direction) => {
                    let dx = targetX - x1; let dy = targetY - y1;
                    if (dx === 0) dx = 0.001; 
                    if ((direction === 1 && dx < 0) || (direction === -1 && dx > 0)) { dx = -dx; dy = -dy; }
                    const scale = 1200 / Math.abs(dx);
                    return { x2: x1 + dx * scale, y2: y1 + dy * scale };
                };

                const M2 = { x: 400, y: 140 }, C2 = { x: 400, y: 200 }, O = { x: 400 - u, y: 140 };
                const dir = isMirror ? -1 : 1; 
                const ray1 = getRayLine(M2.x, M2.y, Ix, Iy, dir);
                const ray2 = getRayLine(C2.x, C2.y, Ix, Iy, dir);
                const isImageInRealSide = isMirror ? (Ix < 400) : (Ix > 400);

                return (
                    <g opacity="0.6">
                        <line x1={O.x} y1={O.y} x2={M2.x} y2={M2.y} stroke="#facc15" strokeWidth="2" strokeDasharray="3 3"/>
                        <line x1={O.x} y1={O.y} x2={C2.x} y2={C2.y} stroke="#facc15" strokeWidth="2" strokeDasharray="3 3"/>
                        <line x1={M2.x} y1={M2.y} x2={isImageInRealSide ? Ix : ray1.x2} y2={isImageInRealSide ? Iy : ray1.y2} stroke="#facc15" strokeWidth="2" />
                        <line x1={C2.x} y1={C2.y} x2={isImageInRealSide ? Ix : ray2.x2} y2={isImageInRealSide ? Iy : ray2.y2} stroke="#facc15" strokeWidth="2" />
                        {isImageInRealSide && <React.Fragment><line x1={Ix} y1={Iy} x2={ray1.x2} y2={ray1.y2} stroke="#facc15" strokeWidth="2" /><line x1={Ix} y1={Iy} x2={ray2.x2} y2={ray2.y2} stroke="#facc15" strokeWidth="2" /></React.Fragment>}
                        {!isReal && <g strokeDasharray="4 4" stroke="#facc15" strokeWidth="1.5"><line x1={M2.x} y1={M2.y} x2={Ix} y2={Iy} /><line x1={C2.x} y1={C2.y} x2={Ix} y2={Iy} /></g>}
                    </g>
                );
            };

            const { b, magSize, isReal, isInverted, descSize, descOrient, isMirror } = physicsInfo;
            let renderMag = magSize > 4 ? 4 : magSize;
            let imgX = isMirror ? (isReal ? 400 - b : 400 + Math.abs(b)) : (isReal ? 400 + b : 400 - Math.abs(b));
            let emojiStr = objType==='apple'?'🍎':objType==='dog'?'🐶':'🚀';

            return (
                <div className="h-full flex flex-col p-4 md:p-6 gap-4 relative">
                    {/* 튜토리얼 오버레이 */}
                    {showTutorial && (
                        <div className="absolute inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 rounded-3xl">
                            <div className="bg-slate-800 border border-cyan-500/50 p-6 sm:p-8 rounded-2xl max-w-sm w-full text-center shadow-[0_0_30px_rgba(6,182,212,0.3)] animate-[drop-in_0.3s_ease-out]">
                                <div className="text-4xl sm:text-5xl mb-4 drop-shadow-lg">💡</div>
                                <h3 className="text-xl font-bold text-cyan-400 mb-4">가상 실험실 꿀팁!</h3>
                                <ul className="text-slate-200 text-sm sm:text-base text-left space-y-3 mb-6 bg-slate-900/50 p-4 rounded-xl">
                                    <li>👆 물체(화살표/이모지)를 마우스로 <strong>직접 끌어서</strong> 자유롭게 움직여보세요!</li>
                                    <li>📏 우측 패널에서 관찰 <strong>물체의 종류</strong>를 변경하면 상이 뒤집히는 모습을 쉽게 볼 수 있습니다.</li>
                                    <li>✨ <strong>작도선</strong>을 켜서 빛이 어떻게 꺾이는지 원리를 눈으로 확인하세요.</li>
                                </ul>
                                <button onClick={() => { setShowTutorial(false); playSound('success'); }} className="w-full py-3 sm:py-4 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-xl transition-all shadow-lg active:scale-95 text-lg">알겠어요! 출발 🚀</button>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-wrap gap-2 justify-center bg-slate-800/50 p-3 rounded-2xl border border-slate-700">
                        {deviceOptions.map(opt => (
                            <button key={opt.id} onClick={() => setDevice(opt.id)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl border transition-all text-sm ${device === opt.id ? 'bg-slate-700 border-cyan-400 text-white shadow-[0_0_10px_rgba(6,182,212,0.3)]' : 'border-slate-600 text-slate-400 hover:bg-slate-700'}`}>
                                <span className={opt.color}>{opt.icon}</span>{opt.name}
                            </button>
                        ))}
                    </div>

                    <div className="flex flex-col lg:flex-row gap-4 flex-1">
                        <div className="flex-1 flex flex-col gap-3">
                            <div className="flex gap-2">
                                <div className="flex-1 bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 flex flex-col justify-center">
                                    <span className="text-xs text-slate-400">상의 특징</span>
                                    <span className="text-lg font-bold text-white">
                                        {u===100 ? "초점 위치 (상 없음)" : <React.Fragment><span className="text-cyan-400">{descSize}</span> <span className="text-purple-400">{descOrient}</span></React.Fragment>}
                                    </span>
                                </div>
                                <div className="bg-slate-900/80 px-4 py-2 rounded-xl border border-slate-700 flex flex-col justify-center items-end">
                                    <div className="text-xs text-slate-400">거리: <span className="text-yellow-400 font-bold text-base">{u}</span></div>
                                    <label className="flex items-center gap-2 cursor-pointer mt-1">
                                        <span className="text-xs text-slate-300">작도선</span>
                                        <input type="checkbox" checked={showRays} onChange={e=>setShowRays(e.target.checked)} className="rounded text-cyan-500 focus:ring-cyan-500 bg-slate-700 border-slate-500"/>
                                    </label>
                                </div>
                            </div>

                            <div className="glass-panel rounded-3xl relative overflow-hidden flex items-center justify-center min-h-[35vh] sm:min-h-[45vh] border-2 border-slate-700 bg-[#080d19]">
                                <svg ref={svgRef} onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerLeave={handlePointerUp} viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet" className="w-full h-full touch-none">
                                    <defs><filter id="neon-glow"><feGaussianBlur stdDeviation="3" result="cb"/><feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
                                    <line x1="0" y1="200" x2="800" y2="200" stroke="#334155" strokeWidth="2" strokeDasharray="10 10" />
                                    <circle cx="300" cy="200" r="4" fill="#64748b" /><circle cx="500" cy="200" r="4" fill="#64748b" />
                                    <g transform="translate(400, 200)">
                                        {device === 'concave_mirror' && <path d="M 10 -120 Q -30 0 10 120" stroke="#06b6d4" strokeWidth="6" fill="none" filter="url(#neon-glow)" strokeLinecap="round"/>}
                                        {device === 'convex_mirror' && <path d="M -10 -120 Q 30 0 -10 120" stroke="#3b82f6" strokeWidth="6" fill="none" filter="url(#neon-glow)" strokeLinecap="round"/>}
                                        {device === 'convex_lens' && <path d="M 0 -130 Q 30 0 0 130 Q -30 0 0 -130" stroke="#8b5cf6" strokeWidth="4" fill="rgba(139,92,246,0.2)" filter="url(#neon-glow)"/>}
                                        {device === 'concave_lens' && <path d="M -20 -120 L 20 -120 Q 0 0 20 120 L -20 120 Q 0 0 -20 -120" stroke="#d946ef" strokeWidth="4" fill="rgba(217,70,239,0.2)" filter="url(#neon-glow)"/>}
                                    </g>
                                    {renderRays()}
                                    
                                    {/* 원본 물체 (드래그 가능) */}
                                    <g transform={`translate(${400 - u}, 200)`} filter="url(#neon-glow)" data-draggable="true" className="draggable-cursor">
                                        <rect x="-20" y="-70" width="40" height="70" fill="transparent" data-draggable="true" /> 
                                        {objType === 'arrow' ? (
                                            <React.Fragment>
                                                <line x1="0" y1="0" x2="0" y2="-60" stroke="#facc15" strokeWidth="8" strokeLinecap="round" pointerEvents="none" />
                                                <polygon points="-10,-50 10,-50 0,-70" fill="#facc15" pointerEvents="none" />
                                            </React.Fragment>
                                        ) : (
                                            <text x="0" y="-5" fontSize="40" textAnchor="middle" pointerEvents="none">{emojiStr}</text>
                                        )}
                                        <text x="0" y="20" fill="#facc15" fontSize="14" fontWeight="bold" textAnchor="middle" pointerEvents="none">물체</text>
                                    </g>
                                    
                                    {/* 상(Image) 렌더링 */}
                                    {u !== 100 && (imgX >=-100 && imgX <=900) && (
                                        <g transform={`translate(${imgX}, 200)`} filter="url(#neon-glow)" opacity={isReal?1:0.6}>
                                            {objType === 'arrow' ? (
                                                <React.Fragment>
                                                    <line x1="0" y1="0" x2="0" y2={isInverted ? 60*renderMag : -60*renderMag} stroke={isReal?"#10b981":"#ec4899"} strokeWidth={8*Math.min(renderMag,1.5)} strokeLinecap="round" strokeDasharray={isReal?"":"6 3"}/>
                                                    <polygon points={`-${10*Math.min(renderMag,1.5)},${isInverted?50*renderMag:-50*renderMag} ${10*Math.min(renderMag,1.5)},${isInverted?50*renderMag:-50*renderMag} 0,${isInverted?70*renderMag:-70*renderMag}`} fill={isReal?"#10b981":"#ec4899"} />
                                                </React.Fragment>
                                            ) : (
                                                <g transform={`scale(${Math.min(renderMag, 2.5)}, ${isInverted ? -renderMag : renderMag})`}>
                                                    <text x="0" y="-5" fontSize="40" textAnchor="middle" pointerEvents="none" opacity={isReal ? 1 : 0.8}>{emojiStr}</text>
                                                </g>
                                            )}
                                            <text x="0" y={isInverted ? -15 : 20} fill={isReal?"#10b981":"#ec4899"} fontSize="16" fontWeight="bold" textAnchor="middle">상</text>
                                        </g>
                                    )}
                                </svg>
                            </div>
                        </div>

                        <div className="lg:w-80 flex flex-col gap-3">
                            <div className="glass-panel p-4 rounded-2xl flex flex-col gap-2 relative z-10">
                                {/* 관찰 물체 변경 옵션 */}
                                <div className="flex justify-between items-center bg-slate-900/50 p-1.5 rounded-xl border border-slate-700/50 mb-1">
                                    {objOptions.map(o => (
                                        <button key={o.id} onClick={() => setObjType(o.id)} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-colors ${objType === o.id ? 'bg-amber-500/20 text-amber-400 border border-amber-500/50' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700/50'}`}>
                                            {o.label}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={()=>setU(50)} className="flex-1 py-2 bg-slate-800 border border-slate-600 rounded-lg text-xs font-bold text-slate-200">가까울 때</button>
                                    <button onClick={()=>setU(150)} className="flex-1 py-2 bg-slate-800 border border-slate-600 rounded-lg text-xs font-bold text-slate-200">멀 때</button>
                                    <button onClick={()=>setU(250)} className="flex-1 py-2 bg-slate-800 border border-slate-600 rounded-lg text-xs font-bold text-slate-200">아주 멀 때</button>
                                </div>
                                <input type="range" min="20" max="300" step="5" value={u} onChange={e=>setU(Number(e.target.value))} className="mt-2"/>
                                <button onClick={addRecord} className="mt-2 w-full py-3 bg-cyan-600 hover:bg-cyan-500 rounded-xl text-white font-bold text-sm shadow-[0_0_10px_rgba(6,182,212,0.3)] active:scale-95">표에 기록하기 📝</button>
                            </div>

                            <div className="glass-panel rounded-2xl p-3 flex-1 overflow-y-auto max-h-[25vh] lg:max-h-[30vh]">
                                <h3 className="text-xs font-bold text-slate-300 mb-2">📊 관찰결과표 ({records.length})</h3>
                                {records.length === 0 ? <p className="text-xs text-slate-500 text-center py-4">기록이 없습니다.</p> : (
                                    <table className="w-full text-[11px] text-left">
                                        <thead className="text-slate-400 bg-slate-800/50"><tr><th className="p-1">기기</th><th className="p-1">거리</th><th className="p-1">특징</th></tr></thead>
                                        <tbody>
                                            {records.map((r,i) => <tr key={i} className="border-b border-slate-700/50"><td className="p-1 text-cyan-300 truncate max-w-[60px]">{r.device.replace(' 거울','').replace(' 렌즈','')}</td><td className="p-1 text-yellow-300">{r.u}</td><td className="p-1 text-white">{r.result}</td></tr>)}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 탭 2: 분류 게임 (Game Tab) ---
        function GameTab({ score, setScore }) {
            const [deck, setDeck] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [animClass, setAnimClass] = useState('card-enter');
            const [feedback, setFeedback] = useState({ show: false, msg: '' });
            const [quiz, setQuiz] = useState({ show: false, q: null });

            useEffect(() => { setDeck([...GAME_ITEMS].sort(() => 0.5 - Math.random())); }, []);

            const currentItem = deck[currentIndex];

            const handleClassify = (type, animName) => {
                if (!currentItem || feedback.show || quiz.show) return;
                setAnimClass(`swipe-${animName}`);
                setTimeout(() => {
                    if (currentItem.type === type) {
                        playSound('success');
                        setScore(s => s + 10);
                        nextStep();
                    } else {
                        playSound('error');
                        setFeedback({ show: true, msg: currentItem.explanation });
                    }
                }, 400); 
            };

            const nextStep = () => {
                setAnimClass('card-enter');
                setFeedback({ show: false });
                const nextIdx = currentIndex + 1;
                if (nextIdx > 0 && nextIdx % 3 === 0 && nextIdx < deck.length) {
                    const randomQuiz = MINI_QUIZZES[Math.floor(Math.random() * MINI_QUIZZES.length)];
                    setQuiz({ show: true, q: randomQuiz });
                    setCurrentIndex(nextIdx);
                } else {
                    setCurrentIndex(nextIdx);
                }
            };

            const handleQuizAnswer = (selected) => {
                if (quiz.q && selected === quiz.q.answer) {
                    playSound('success');
                    setScore(s => s + 20); setQuiz({ show: false, q: null });
                } else {
                    playSound('error');
                    alert("다시 한 번 생각해보세요!"); 
                }
            };

            if (currentIndex >= deck.length) {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 text-center h-full pt-20 animate-[drop-in_0.5s_ease-out]">
                        <div className="text-6xl mb-4">🎉</div>
                        <h2 className="text-3xl font-bold text-amber-400 mb-2">게임 완료!</h2>
                        <p className="text-slate-300 mb-6">획득 점수: <strong className="text-2xl ml-1">{score}</strong> 점</p>
                        <p className="text-slate-400 text-sm bg-slate-800/50 p-4 rounded-xl border border-slate-700 max-w-sm mx-auto">해결 공방 탭으로 이동하여<br/>손님들의 문제를 직접 해결해보세요!</p>
                    </div>
                );
            }

            return (
                <div className="h-full flex flex-col p-4 md:p-8 relative overflow-hidden">
                    <div className="flex justify-between items-center mb-8 bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
                        <div className="text-slate-300 font-bold text-sm">진행도: <span className="text-amber-400">{currentIndex + 1} / {deck.length}</span></div>
                        <div className="text-slate-300 font-bold text-sm">점수: <span className="text-amber-400 text-xl">{score}</span></div>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center min-h-[250px] perspective-1000">
                        {currentItem && !quiz.show && (
                            <div className={`w-full max-w-sm glass-panel rounded-3xl p-8 flex flex-col items-center text-center shadow-[0_0_40px_rgba(0,0,0,0.4)] border border-slate-500/50 ${animClass}`}>
                                <div className="text-8xl mb-6 drop-shadow-2xl">{currentItem.emoji}</div>
                                <h3 className="text-2xl font-black text-white mb-3">{currentItem.name}</h3>
                                <p className="text-amber-100 bg-amber-900/30 border border-amber-500/30 px-5 py-2.5 rounded-full text-sm font-bold shadow-inner">"{currentItem.desc}"</p>
                            </div>
                        )}
                    </div>

                    {!quiz.show && (
                        <div className="grid grid-cols-2 gap-3 md:gap-6 mt-8 max-w-md mx-auto w-full relative z-10">
                            <button onClick={() => handleClassify('concave_mirror', 'left')} className="py-5 bg-gradient-to-br from-cyan-600/90 to-cyan-800/90 hover:from-cyan-500 hover:to-cyan-700 rounded-2xl text-white font-bold border border-cyan-400/50 shadow-xl active:scale-95 transition-all text-sm sm:text-base">👈 오목 거울</button>
                            <button onClick={() => handleClassify('convex_mirror', 'right')} className="py-5 bg-gradient-to-br from-blue-600/90 to-blue-800/90 hover:from-blue-500 hover:to-blue-700 rounded-2xl text-white font-bold border border-blue-400/50 shadow-xl active:scale-95 transition-all text-sm sm:text-base">볼록 거울 👉</button>
                            <button onClick={() => handleClassify('concave_lens', 'left')} className="py-5 bg-gradient-to-br from-fuchsia-600/90 to-fuchsia-800/90 hover:from-fuchsia-500 hover:to-fuchsia-700 rounded-2xl text-white font-bold border border-fuchsia-400/50 shadow-xl active:scale-95 transition-all text-sm sm:text-base">👈 오목 렌즈</button>
                            <button onClick={() => handleClassify('convex_lens', 'right')} className="py-5 bg-gradient-to-br from-purple-600/90 to-purple-800/90 hover:from-purple-500 hover:to-purple-700 rounded-2xl text-white font-bold border border-purple-400/50 shadow-xl active:scale-95 transition-all text-sm sm:text-base">볼록 렌즈 👉</button>
                        </div>
                    )}

                    <Modal isOpen={feedback.show} title="앗, 다시 생각해볼까요?" onClose={null}>
                        <div className="text-center pb-4">
                            <div className="text-6xl mb-4">🤔</div>
                            <p className="text-base text-slate-200 leading-relaxed mb-6 font-medium bg-slate-900/50 p-4 rounded-xl">{feedback.msg}</p>
                            <button onClick={nextStep} className="w-full py-4 bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-bold shadow-lg text-lg">이해했어요! (다음으로)</button>
                        </div>
                    </Modal>

                    <Modal isOpen={quiz.show} title="보너스 미니 퀴즈!" onClose={null}>
                        <div className="text-center pb-2">
                            <p className="text-base sm:text-lg text-slate-100 font-bold mb-8 leading-relaxed bg-indigo-900/30 border border-indigo-500/30 p-4 rounded-xl">Q. {quiz.q ? quiz.q.q : ''}</p>
                            <div className="flex flex-col gap-3">
                                {quiz.q && quiz.q.options.map((opt, i) => (
                                    <button key={i} onClick={() => handleQuizAnswer(opt)} className="w-full py-4 bg-slate-700 hover:bg-indigo-600 border border-slate-500 hover:border-indigo-400 rounded-xl font-bold text-white transition-all active:scale-95 text-base shadow-md">{opt}</button>
                                ))}
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        }

        // --- 탭 3: 안경점 & 공방 (Workshop Tab) ---
        function WorkshopTab({ score, setScore }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [status, setStatus] = useState('idle'); 
            const [showHint, setShowHint] = useState(false);

            const mission = WORKSHOP_MISSIONS[currentIndex];

            const handleToolSelect = (toolId) => {
                if (status === 'success') return;
                
                if (toolId === mission.type) {
                    playSound('success');
                    setStatus('success');
                    setShowHint(false);
                    setScore(s => s + 25);
                } else {
                    playSound('error');
                    setStatus('error');
                    setShowHint(true);
                }
            };

            const nextMission = () => {
                setStatus('idle');
                setShowHint(false);
                setCurrentIndex(prev => prev + 1);
            };

            if (currentIndex >= WORKSHOP_MISSIONS.length) {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center p-6 text-center h-full pt-20 animate-[drop-in_0.5s_ease-out]">
                        <div className="text-6xl mb-4">🏆</div>
                        <h2 className="text-3xl font-bold text-emerald-400 mb-2">모든 손님의 문제를 해결했습니다!</h2>
                        <p className="text-slate-300 mb-6">공방 점수: <strong className="text-2xl ml-1">{score}</strong> 점</p>
                        <p className="text-slate-400 text-sm bg-slate-800/50 p-4 rounded-xl border border-slate-700 max-w-sm mx-auto">상단의 [최종 보고서] 버튼을 눌러 제출해주세요.</p>
                    </div>
                );
            }

            const isSuccess = status === 'success';
            let visualStyle = { transition: 'all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)' };
            
            if (mission.effectType === 'blur') {
                visualStyle.filter = isSuccess ? 'blur(0px)' : 'blur(5px)';
            } else if (mission.effectType === 'magnify') {
                visualStyle.transform = isSuccess ? 'scale(2.5)' : 'scale(1)';
            } else if (mission.effectType === 'wide') {
                visualStyle.transform = isSuccess ? 'scale(0.6)' : 'scale(1.2)';
            }

            return (
                <div className="h-full flex flex-col p-4 md:p-6 gap-4 relative">
                    <div className="flex justify-between items-center bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
                        <div className="text-slate-300 font-bold text-sm">미션: <span className="text-emerald-400">{currentIndex + 1} / {WORKSHOP_MISSIONS.length}</span></div>
                        <div className="text-slate-300 font-bold text-sm">점수: <span className="text-emerald-400 text-xl">{score}</span></div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-6 flex-1">
                        <div className="flex-[2] glass-panel rounded-3xl p-6 flex flex-col items-center text-center relative border-emerald-500/30 shadow-[0_0_30px_rgba(16,185,129,0.1)]">
                            <div className="text-7xl mb-2 drop-shadow-xl">{mission.emoji}</div>
                            <h3 className="text-xl font-bold text-white mb-4 bg-slate-900/80 border border-slate-700 px-5 py-1.5 rounded-full">{mission.name}</h3>
                            
                            <div className="bg-emerald-900/40 border border-emerald-500/40 p-5 rounded-2xl rounded-tl-none relative w-full mb-6 max-w-md shadow-inner">
                                <p className="text-emerald-100 text-sm md:text-base font-medium leading-relaxed">"{mission.problem}"</p>
                            </div>

                            <div className={`w-full max-w-md text-left bg-slate-900/90 p-4 rounded-xl border border-amber-500/50 transition-all duration-300 ${showHint ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2 pointer-events-none'}`}>
                                <p className="text-amber-400 text-sm font-bold flex items-center gap-2">💡 힌트</p>
                                <p className="text-slate-300 text-sm mt-1 leading-relaxed">{mission.hint}</p>
                            </div>

                            <div className="mt-auto w-full max-w-md border-2 border-slate-600 rounded-2xl bg-[#080d19] h-40 flex items-center justify-center overflow-hidden relative shadow-lg">
                                <div className="absolute top-2 left-3 text-[10px] text-slate-500 font-bold tracking-widest uppercase">고객의 시야</div>
                                <div className="text-4xl font-black text-white whitespace-nowrap" style={visualStyle}>
                                    {mission.visualContent}
                                </div>
                                {isSuccess && <div className="absolute inset-0 bg-emerald-500/20 pointer-events-none animate-pulse"></div>}
                            </div>
                        </div>

                        <div className="flex-[3] flex flex-col gap-4">
                            {!isSuccess ? (
                                <div className="glass-panel rounded-3xl p-6 h-full flex flex-col justify-center">
                                    <h3 className="text-xl font-black text-slate-200 mb-8 text-center tracking-tight">적절한 도구를 <span className="text-emerald-400 border-b-2 border-emerald-400">처방</span>해주세요!</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <button onClick={() => handleToolSelect('concave_mirror')} className="py-8 bg-slate-800 hover:bg-slate-700 border border-cyan-500/50 rounded-2xl text-white font-bold transition-all active:scale-95 flex flex-col items-center gap-3 shadow-xl">
                                            <div className="scale-125"><Icons.MirrorConcave /></div> <span className="text-cyan-400 text-lg">오목 거울</span>
                                        </button>
                                        <button onClick={() => handleToolSelect('convex_mirror')} className="py-8 bg-slate-800 hover:bg-slate-700 border border-blue-500/50 rounded-2xl text-white font-bold transition-all active:scale-95 flex flex-col items-center gap-3 shadow-xl">
                                            <div className="scale-125"><Icons.MirrorConvex /></div> <span className="text-blue-400 text-lg">볼록 거울</span>
                                        </button>
                                        <button onClick={() => handleToolSelect('concave_lens')} className="py-8 bg-slate-800 hover:bg-slate-700 border border-fuchsia-500/50 rounded-2xl text-white font-bold transition-all active:scale-95 flex flex-col items-center gap-3 shadow-xl">
                                            <div className="scale-125"><Icons.LensConcave /></div> <span className="text-fuchsia-400 text-lg">오목 렌즈</span>
                                        </button>
                                        <button onClick={() => handleToolSelect('convex_lens')} className="py-8 bg-slate-800 hover:bg-slate-700 border border-purple-500/50 rounded-2xl text-white font-bold transition-all active:scale-95 flex flex-col items-center gap-3 shadow-xl">
                                            <div className="scale-125"><Icons.LensConvex /></div> <span className="text-purple-400 text-lg">볼록 렌즈</span>
                                        </button>
                                    </div>
                                    {status === 'error' && <p className="text-rose-400 text-center text-sm font-bold mt-6 bg-rose-900/30 py-2 rounded-lg animate-pulse">앗! 이 도구는 적절하지 않아요. 좌측의 힌트를 확인해보세요.</p>}
                                </div>
                            ) : (
                                <div className="glass-panel rounded-3xl p-6 h-full flex flex-col items-center justify-center text-center bg-emerald-900/30 border-2 border-emerald-500/50 card-enter shadow-[0_0_40px_rgba(16,185,129,0.2)]">
                                    <div className="w-24 h-24 bg-emerald-500/20 rounded-full flex items-center justify-center mb-6 shadow-inner"><Icons.Check /></div>
                                    <h3 className="text-3xl font-black text-emerald-400 mb-6">{mission.successTitle}</h3>
                                    <p className="text-slate-200 leading-relaxed mb-10 max-w-md bg-slate-900/80 p-5 rounded-2xl border border-emerald-500/30 text-left">
                                        <span className="font-black text-emerald-300 block mb-2 text-lg">💡 원리 요약</span>
                                        {mission.successDesc}
                                    </p>
                                    <button onClick={nextMission} className="w-full max-w-sm py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl font-bold shadow-[0_0_20px_rgba(16,185,129,0.4)] transition-all active:scale-95 text-lg btn-neon">
                                        다음 손님 맞이하기 👉
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- 탭 4: 통합 보고서 제출 (Report View) ---
        function ReportView({ goBack, gameScore, workshopScore, labRecords, onComplete, showAlert }) {
            const [data, setData] = useState({ studentId: '', studentName: '', insight: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const submit = () => {
                if(!data.studentId || !data.studentName || !data.insight) return showAlert("모든 항목을 입력해주세요.");
                if(!GOOGLE_SCRIPT_URL) return showAlert("DB URL이 연결되지 않았습니다. 우측 상단 가이드를 확인하세요.");

                setIsSubmitting(true);
                const payload = {
                    timestamp: new Date().toISOString(),
                    studentId: data.studentId, studentName: data.studentName,
                    gameScore, workshopScore, records: JSON.stringify(labRecords), insight: data.insight
                };

                fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
                .then(() => { setTimeout(() => { setIsSubmitting(false); onComplete(data.studentName); }, 1500); })
                .catch(() => { setIsSubmitting(false); showAlert("제출 중 네트워크 오류가 발생했습니다."); });
            };

            return (
                <div className="min-h-screen p-4 flex justify-center items-center">
                    <div className="w-full max-w-3xl glass-panel rounded-3xl p-6 md:p-10 relative shadow-[0_0_50px_rgba(0,0,0,0.5)]">
                        <button onClick={goBack} className="absolute top-6 left-6 text-slate-400 hover:text-white transition font-bold text-sm bg-slate-800/50 px-3 py-1.5 rounded-lg border border-slate-700">◀ 돌아가기</button>
                        <h2 className="text-3xl font-black text-center mb-10 mt-10 neon-text-purple tracking-tight">최종 학습 보고서</h2>

                        <div className="grid grid-cols-3 gap-3 md:gap-6 mb-10 text-sm">
                            <div className="bg-slate-800/80 p-4 md:p-6 rounded-2xl border-2 border-cyan-500/30 text-center flex flex-col justify-center shadow-lg transform transition hover:-translate-y-1">
                                <div className="text-slate-400 text-xs md:text-sm font-bold mb-2">실험실 기록</div>
                                <div className="text-2xl md:text-3xl font-black text-cyan-400">{labRecords.length} <span className="text-xs md:text-sm font-medium">건</span></div>
                            </div>
                            <div className="bg-slate-800/80 p-4 md:p-6 rounded-2xl border-2 border-amber-500/30 text-center flex flex-col justify-center shadow-lg transform transition hover:-translate-y-1">
                                <div className="text-slate-400 text-xs md:text-sm font-bold mb-2">분류게임 점수</div>
                                <div className="text-2xl md:text-3xl font-black text-amber-400">{gameScore} <span className="text-xs md:text-sm font-medium">점</span></div>
                            </div>
                            <div className="bg-slate-800/80 p-4 md:p-6 rounded-2xl border-2 border-emerald-500/30 text-center flex flex-col justify-center shadow-lg transform transition hover:-translate-y-1">
                                <div className="text-slate-400 text-xs md:text-sm font-bold mb-2">해결공방 점수</div>
                                <div className="text-2xl md:text-3xl font-black text-emerald-400">{workshopScore} <span className="text-xs md:text-sm font-medium">점</span></div>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <div className="flex flex-col sm:flex-row gap-5">
                                <div className="flex-1">
                                    <label className="block text-sm font-bold text-slate-300 ml-1 mb-2">학번</label>
                                    <input type="text" placeholder="예: 2101" value={data.studentId} onChange={e=>setData({...data,studentId:e.target.value})} className="w-full bg-slate-900/80 border border-slate-600 rounded-xl p-4 text-white focus:border-purple-400 focus:ring-1 focus:ring-purple-400 outline-none transition text-lg" />
                                </div>
                                <div className="flex-1">
                                    <label className="block text-sm font-bold text-slate-300 ml-1 mb-2">이름</label>
                                    <input type="text" placeholder="홍길동" value={data.studentName} onChange={e=>setData({...data,studentName:e.target.value})} className="w-full bg-slate-900/80 border border-slate-600 rounded-xl p-4 text-white focus:border-purple-400 focus:ring-1 focus:ring-purple-400 outline-none transition text-lg" />
                                </div>
                            </div>
                            <div className="flex flex-col">
                                <label className="block text-sm font-bold text-slate-300 ml-1 mb-2">종합하여 알게 된 점</label>
                                <textarea placeholder="세 가지 활동(실험, 게임, 공방)을 통해 거울과 렌즈에 대해 새롭게 알게 된 점을 구체적으로 적어보세요." value={data.insight} onChange={e=>setData({...data,insight:e.target.value})} className="w-full min-h-[150px] bg-slate-900/80 border border-slate-600 rounded-xl p-5 text-white focus:border-purple-400 focus:ring-1 focus:ring-purple-400 outline-none resize-none transition leading-relaxed text-base"></textarea>
                            </div>
                            <button onClick={submit} disabled={isSubmitting} className="w-full py-5 mt-4 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black text-xl transition-transform active:scale-95 disabled:opacity-50 shadow-[0_0_20px_rgba(139,92,246,0.4)] btn-neon">
                                {isSubmitting ? "데이터를 전송하는 중..." : "최종 결과 제출하기 🚀"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
